
# ──────────────────────────────────────────────
#  Browser Configuration
# ──────────────────────────────────────────────
browser=chrome

# ──────────────────────────────────────────────
#  Application URL
# ──────────────────────────────────────────────
url=https://demo.cyclos.org/ui/home

# ──────────────────────────────────────────────
#  Login Credentials  (demo.cyclos.org public demo)
# ──────────────────────────────────────────────
username=demo
password=1234

# ──────────────────────────────────────────────
#  Environment
# ──────────────────────────────────────────────
environment=QA

# ──────────────────────────────────────────────
#  Headless Mode  (true = CI / false = local debug)
# ──────────────────────────────────────────────
headless=true

# ──────────────────────────────────────────────
#  Timeouts (seconds) - tuned for Angular SPA on remote demo server
# ──────────────────────────────────────────────
explicitWait=40
pageLoadTimeout=90
loginWaitTimeout=60

# ──────────────────────────────────────────────
#  Login Retry Attempts before marking FAIL
# ──────────────────────────────────────────────
loginRetryCount=2

# ──────────────────────────────────────────────
#  Parallel Execution
# ──────────────────────────────────────────────
parallel=true

# ──────────────────────────────────────────────
#  Paths
# ──────────────────────────────────────────────
screenshotPath=screenshots/
reportPath=reports/
